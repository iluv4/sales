<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세일즈 에이전트</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e3e6ea;
  --text: #1c2024; --muted: #6b7280; --accent: #2f6fed; --accent-text: #ffffff;
  --user-bubble: #2f6fed; --user-text: #ffffff; --danger: #c2410c; --ok: #15803d;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111315; --surface: #1a1d20; --surface-2: #23272b; --border: #2e3338;
    --text: #e8eaed; --muted: #9aa1a9; --accent: #5b8ff9; --accent-text: #0b0d0f;
    --user-bubble: #3b6fd9; --user-text: #ffffff; --danger: #fb923c; --ok: #4ade80;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
button {
  font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); padding: 6px 12px;
}
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
#chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
#messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 760px; width: fit-content; padding: 10px 14px; border-radius: var(--radius); overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); white-space: pre-wrap; }
.msg.agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
.msg.agent p:first-child { margin-top: 0; } .msg.agent p:last-child { margin-bottom: 0; }
.msg.agent ul, .msg.agent ol { margin: 6px 0; padding-left: 20px; }
.msg.agent h4 { margin: 10px 0 4px; color: var(--text); font-size: 15px; }
.msg.agent code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.msg.agent a { color: var(--accent); }
.msg.error { align-self: flex-start; color: var(--danger); background: var(--surface); border: 1px solid var(--danger); }
.steps { list-style: none; margin: 8px 0 0; padding: 0; color: var(--muted); font-size: 13px; }
.steps li::before { content: "· "; }
.working { color: var(--muted); }
#empty { margin: auto; text-align: center; color: var(--muted); max-width: 520px; }
#empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.chips button { border-radius: 999px; font-size: 14px; }
form { display: flex; gap: 8px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); }
textarea {
  flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; max-height: 180px;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px; background: transparent; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
#panel { flex: 1; overflow-y: auto; padding: 14px 16px; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg); }
.card h3 { margin: 0 0 2px; font-size: 15px; }
.card .meta { color: var(--muted); font-size: 13px; }
.card.clickable { cursor: pointer; } .card.clickable:hover { border-color: var(--accent); }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.score { font-weight: 650; }
.body { white-space: pre-wrap; margin: 8px 0; font-size: 14px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 20px; }
.stat span { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }
h4 { margin: 14px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 42vh; }
  #chat { border-right: 0; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>
<header>
  <h1>세일즈 에이전트</h1>
  <button id="new-chat" type="button">새 대화</button>
</header>
<main>
  <section id="chat">
    <div id="messages" aria-live="polite">
      <div id="empty">
        <h2>무엇을 도와드릴까요?</h2>
        <div>잠재 고객을 찾고, 조사하고, 적합도를 평가하고, 메일 초안을 써드려요.<br>초안은 직접 확인한 뒤 보내세요.</div>
        <div class="chips">
          <button type="button">우리 고객에 맞는 회사 5곳 찾아서 리드로 넣어줘</button>
          <button type="button">점수 높은 리드에 첫 메일 초안 써줘</button>
          <button type="button">오늘 뭐부터 하면 돼?</button>
        </div>
      </div>
    </div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="할 일을 적어주세요" aria-label="메시지"></textarea>
      <button class="primary" id="send" type="submit">보내기</button>
    </form>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="pipeline" aria-selected="true">파이프라인</button>
      <button role="tab" data-tab="leads" aria-selected="false">리드</button>
      <button role="tab" data-tab="drafts" aria-selected="false">메일 초안</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>
<script>
const STAGE_LABELS = {
  new: "신규", researching: "조사 중", qualified: "적합", contacted: "연락함", meeting: "미팅",
  proposal: "제안", won: "성사", lost: "실패", disqualified: "부적합"
};
const CHANNEL_LABELS = { email: "이메일", linkedin: "링크드인", call_script: "통화 스크립트", follow_up: "후속 메일" };

const $ = (sel) => document.querySelector(sel);
const messages = $("#messages"), input = $("#input"), sendBtn = $("#send"), panel = $("#panel");
// The conversation lives on the server for this page only; reloading starts a new one.
let conversationId = null, busy = false, currentTab = "pipeline";

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  for (const child of children) if (child != null) node.append(child);
  return node;
}

// A small markdown renderer for the agent's replies. Text is HTML-escaped before any markup is
// added, so nothing in a reply can inject HTML; links are limited to http(s).
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderMarkdown(node, text) {
  const out = [];
  let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; } };
  for (const line of text.split("\n")) {
    const bullet = line.match(/^\s*[-*]\s+(.*)$/), numbered = line.match(/^\s*\d+[.)]\s+(.*)$/), heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (bullet || numbered) {
      flushPara();
      const tag = bullet ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((bullet || numbered)[1]);
    } else if (heading) {
      flushPara(); flushList(); out.push("<h4>" + inline(heading[2]) + "</h4>");
    } else if (!line.trim()) {
      flushPara(); flushList();
    } else {
      flushList(); para.push(line);
    }
  }
  flushPara(); flushList();
  node.innerHTML = out.join("");
}

function addMessage(cls, text) {
  $("#empty")?.remove();
  const node = el("div", { className: "msg " + cls });
  if (cls === "agent") renderMarkdown(node, text); else node.textContent = text;
  messages.append(node);
  messages.scrollTop = messages.scrollHeight;
  return node;
}

function setConversation(id) { conversationId = id; }

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  addMessage("user", text);
  const pending = el("div", { className: "msg agent" }, el("div", { className: "working", textContent: "작업 중…" }));
  const steps = el("ul", { className: "steps" });
  pending.append(steps);
  messages.append(pending);
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, conversation_id: conversationId })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "요청이 실패했어요");
    }
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "", done = false;
    while (!done) {
      const chunk = await reader.read();
      done = chunk.done;
      buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
      let line;
      while ((line = buffer.indexOf("\n")) >= 0) {
        const raw = buffer.slice(0, line); buffer = buffer.slice(line + 1);
        if (!raw.trim()) continue;
        const event = JSON.parse(raw);
        if (event.type === "conversation") setConversation(event.id);
        else if (event.type === "step") { steps.append(el("li", { textContent: event.text })); messages.scrollTop = messages.scrollHeight; }
        else if (event.type === "reply") {
          pending.replaceChildren();
          const body = el("div"); renderMarkdown(body, event.text || "(빈 답변)");
          pending.append(body);
          if (steps.children.length) pending.append(steps);
        } else if (event.type === "error") {
          pending.className = "msg error"; pending.replaceChildren(event.text);
        }
      }
    }
  } catch (e) {
    pending.className = "msg error"; pending.replaceChildren(e.message);
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
    messages.scrollTop = messages.scrollHeight;
    refreshPanel();
  }
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || "불러오지 못했어요");
  return res.json();
}

function leadCard(lead) {
  const who = [lead.contact_name, lead.title].filter(Boolean).join(" · ");
  const card = el("div", { className: "card clickable" },
    el("div", { className: "row" },
      el("h3", { textContent: lead.company }),
      el("span", { className: "badge", textContent: STAGE_LABELS[lead.stage] || lead.stage }),
      lead.score != null ? el("span", { className: "score", textContent: lead.score + "점" }) : null),
    who ? el("div", { className: "meta", textContent: who }) : null);
  card.onclick = () => showLead(lead.id);
  return card;
}

async function showPipeline() {
  const data = await api("/api/pipeline");
  const c = data.counts_by_stage;
  const stats = [["진행 중", data.open_leads], ["적합", c.qualified], ["미팅", c.meeting],
                 ["제안", c.proposal], ["성사", c.won], ["검토할 초안", data.drafts_awaiting_review]];
  panel.replaceChildren(el("div", { className: "stat-grid" },
    ...stats.map(([label, n]) => el("div", { className: "stat" }, el("b", { textContent: n }), el("span", { textContent: label })))));
  panel.append(el("h4", { textContent: "점수 높은 리드" }));
  if (!data.top_scored_open_leads.length) panel.append(el("div", { className: "muted", textContent: "아직 평가한 리드가 없어요." }));
  data.top_scored_open_leads.forEach((lead) => panel.append(leadCard(lead)));
  const stale = Object.entries(data).find(([k]) => k.startsWith("stale_leads"))?.[1] || [];
  if (stale.length) {
    panel.append(el("h4", { textContent: "한동안 활동 없는 리드" }));
    stale.forEach((lead) => panel.append(leadCard(lead)));
  }
}

async function showLeads() {
  const leads = await api("/api/leads");
  panel.replaceChildren();
  if (!leads.length) panel.append(el("div", { className: "muted", textContent: "리드가 없어요. 채팅으로 리드를 찾아달라고 해보세요." }));
  leads.forEach((lead) => panel.append(leadCard(lead)));
}

async function showLead(id) {
  const { lead, activities, drafts } = await api("/api/leads/" + id);
  const back = el("button", { type: "button", textContent: "← 목록" });
  back.onclick = () => selectTab(currentTab);
  const facts = [["담당자", lead.contact_name], ["직책", lead.title], ["이메일", lead.email], ["웹사이트", lead.website],
                 ["업종", lead.industry], ["규모", lead.company_size], ["지역", lead.location], ["메모", lead.notes]];
  panel.replaceChildren(back, el("div", { className: "card" },
    el("div", { className: "row" }, el("h3", { textContent: lead.company }),
      el("span", { className: "badge", textContent: STAGE_LABELS[lead.stage] || lead.stage }),
      lead.score != null ? el("span", { className: "score", textContent: lead.score + "점" }) : null),
    ...facts.filter(([, v]) => v).map(([k, v]) => el("div", { className: "meta", textContent: k + ": " + v }))));
  panel.append(el("h4", { textContent: "활동 기록" }));
  if (!activities.length) panel.append(el("div", { className: "muted", textContent: "기록이 없어요." }));
  activities.slice().reverse().forEach((a) => panel.append(el("div", { className: "card" },
    el("div", { className: "meta", textContent: a.created_at.slice(0, 10) + " · " + a.kind }),
    el("div", { className: "body", textContent: a.summary }))));
  if (drafts.length) { panel.append(el("h4", { textContent: "메일 초안" })); drafts.forEach((d) => panel.append(draftCard(d))); }
}

function draftCard(d) {
  const to = d.contact_name ? d.contact_name + " · " + d.company : d.company;
  const copy = el("button", { type: "button", textContent: "복사" });
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText((d.subject ? d.subject + "\n\n" : "") + d.body); copy.textContent = "복사됨"; }
    catch (e) { copy.textContent = "복사 실패"; }
  };
  const mark = (status, label) => {
    const b = el("button", { type: "button", textContent: label });
    b.onclick = async () => { await api(`/api/drafts/${d.id}/status`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) }); refreshPanel(); };
    return b;
  };
  return el("div", { className: "card" },
    el("div", { className: "meta", textContent: (CHANNEL_LABELS[d.channel] || d.channel) + " → " + to }),
    d.subject ? el("h3", { textContent: d.subject }) : null,
    el("div", { className: "body", textContent: d.body }),
    d.status === "draft" ? el("div", { className: "row" }, copy, mark("sent", "보냄 표시"), mark("discarded", "버리기"))
                         : el("span", { className: "badge", textContent: d.status === "sent" ? "보냄" : "버림" }));
}

async function showDrafts() {
  const drafts = await api("/api/drafts?status=draft");
  panel.replaceChildren();
  if (!drafts.length) panel.append(el("div", { className: "muted", textContent: "검토할 초안이 없어요." }));
  drafts.forEach((d) => panel.append(draftCard(d)));
}

const views = { pipeline: showPipeline, leads: showLeads, drafts: showDrafts };
function selectTab(name) {
  currentTab = name;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === name));
  refreshPanel();
}
function refreshPanel() {
  views[currentTab]().catch((e) => panel.replaceChildren(el("div", { className: "muted", textContent: e.message })));
}

document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => selectTab(b.dataset.tab)));
document.querySelectorAll(".chips button").forEach((b) => (b.onclick = () => send(b.textContent)));
$("#composer").onsubmit = (e) => { e.preventDefault(); const text = input.value; input.value = ""; autosize(); send(text); };
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); }
});
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", autosize);
$("#new-chat").onclick = async () => {
  if (busy) return;
  if (conversationId) await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ conversation_id: conversationId }) }).catch(() => {});
  setConversation(null);
  location.reload();
};
refreshPanel();
input.focus();
</script>
</body>
</html>
